name: Verify Supabase public API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - js/config.js
      - scripts/verify-backend.mjs
      - .github/workflows/verify-backend.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-backend.mjs
